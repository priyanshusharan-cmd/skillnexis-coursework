# Mosquitto 2.x broker for the smart home: TLS only, every client must present a certificate signed by our CA.
#   mosquitto -c security/mosquitto_tls.conf     (paths are relative to iot/week-4)
per_listener_settings false
allow_anonymous false

listener 8883
cafile security/certs/ca.crt
certfile security/certs/broker.crt
keyfile security/certs/broker.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2

acl_file security/acl

# no plain-text listener: port 1883 is deliberately not opened
# small control messages: send immediately instead of waiting to batch (Nagle), ~85 ms -> ~3 ms round trip
set_tcp_nodelay true
max_inflight_messages 20
max_queued_messages 1000
