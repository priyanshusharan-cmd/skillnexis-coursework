<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Writing assistant prompt builder</title><style>body{font:16px system-ui;max-width:760px;margin:2rem auto;padding:0 1rem}textarea{width:100%;min-height:9rem}label{display:block;margin:.8rem 0}button,select,input{padding:.45rem}</style><h1>Writing assistant</h1><p>Build a prompt locally. Model/API integration is intentionally not connected.</p><label>Template <select id="kind"><option>Summarization</option><option>Extraction</option><option>Classification</option><option>Question answering</option><option>Rewrite</option></select></label><label>Temperature (requested setting only) <input id="temp" type="number" min="0" max="2" step="0.1" value="0.2"></label><label>Source text <textarea id="source" placeholder="Paste non-sensitive sample text"></textarea></label><button id="build">Build prompt</button><label>Prompt preview <textarea id="out" readonly></textarea></label><p id="note" aria-live="polite"></p><script>document.querySelector('#build').onclick=()=>{const t=document.querySelector('#kind').value,s=document.querySelector('#source').value.trim(),temp=Number(document.querySelector('#temp').value);if(!s){document.querySelector('#note').textContent='Enter sample text first.';return}if(!Number.isFinite(temp)||temp<0||temp>2){document.querySelector('#note').textContent='Use a temperature from 0 to 2.';return}const tasks={Summarization:'Summarize the source in five concise bullets. Preserve facts and flag uncertainty.',Extraction:'Extract dates, people, and decisions as JSON. Use null for absent fields.',Classification:'Classify the source as informational, request, or decision. Give one evidence sentence.', 'Question answering':'Answer the question using only the source. Say not found if unsupported.',Rewrite:'Rewrite the source in clear, concise language without changing its meaning.'};document.querySelector('#out').value=`Task: ${tasks[t]}

Source:
${s}`;document.querySelector('#note').textContent=`Prompt assembled. Temperature ${temp} is recorded but no model was called.`};</script></html>
