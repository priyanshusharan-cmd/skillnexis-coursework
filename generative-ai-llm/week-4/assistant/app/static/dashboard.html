<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assistant analytics</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#15171c;--mute:#667085;--line:#e4e7ec;--acc:#3056d3;--acc2:#9db1f0;--warn:#b54708}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--ink:#e8eaed;--mute:#98a2b3;--line:#2a2f3a;--acc:#7c9cff;--acc2:#3b4f8f;--warn:#fdb022}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px}header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:19px;margin:0}h2{font-size:14px;margin:0 0 10px}.mute{color:var(--mute);font-size:12px}
input,button{font:inherit;color:inherit}input{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}button{border:0;background:var(--acc);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:820px){.grid{grid-template-columns:1fr}}section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}.bar span:first-child{width:130px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar i{display:block;height:12px;background:var(--acc);border-radius:0 3px 3px 0}.bar em{font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mute);font-weight:600}.tw{overflow-x:auto}.w{color:var(--warn)}
</style></head><body><div class="wrap">
<header><div><h1>Assistant analytics</h1><div class="mute" id="sub">enter an admin key</div></div>
<form onsubmit="go(event)" style="display:flex;gap:6px"><input id="key" type="password" placeholder="admin API key"><button>Load</button></form></header>
<div class="kpis" id="kpis"></div>
<div class="grid">
<section><h2>Requests per day</h2><div id="days"></div></section>
<section><h2>Outcomes</h2><div id="status"></div><h2 style="margin-top:12px">Guardrail events</h2><div id="guard"></div></section>
<section><h2>Tokens and cost by user</h2><div id="users"></div></section>
<section><h2>Most-used sources</h2><div id="sources"></div></section>
</div>
<section style="margin-top:12px"><h2>Recent requests</h2><div class="tw"><table id="recent"></table></div></section>
</div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let KEY=''; try{KEY=sessionStorage.getItem('ak')||''}catch(e){}; $('key').value=KEY; if(KEY) load();
function go(e){e.preventDefault(); KEY=$('key').value.trim(); try{sessionStorage.setItem('ak',KEY)}catch(e){}; load()}
function bars(el,pairs,fmt=v=>v){const m=Math.max(1,...pairs.map(p=>p[1])); el.innerHTML=pairs.length?pairs.map(([k,v])=>`<div class="bar"><span title="${esc(k)}">${esc(k)}</span><i style="width:${Math.max(2,v/m*60)}%"></i><em>${fmt(v)}</em></div>`).join(''):'<div class="mute">none</div>'}
async function load(){const r=await fetch('/admin/analytics',{headers:{Authorization:'Bearer '+KEY}}); const d=await r.json();
  if(!r.ok){$('sub').innerHTML=`<span class="w">${esc(d.error.message)}</span>`; return}
  $('sub').textContent=`last 30 days · engine ${d.provider} · ${d.documents} uploaded document(s) · tokens ${Math.round(d.exact_token_share*100)}% exact, rest estimated`;
  const k=[['Requests',d.requests],['Answered',d.answered],['Tokens',(d.prompt_tokens+d.completion_tokens).toLocaleString()],['Cost (USD)','$'+d.cost_usd.toFixed(4)],
    ['Same traffic on Gemini 2.5 Flash','$'+d.cost_if_gemini_2_5_flash.toFixed(4)],['Latency p50 / p95',`${d.latency_ms.p50??'–'} / ${d.latency_ms.p95??'–'} ms`],['First token p50',`${d.ttft_ms.p50??'–'} ms`],
    ['Mean groundedness',d.grounded_mean==null?'–':Math.round(d.grounded_mean*100)+'%'],['Flagged answers',d.flagged_answers]];
  $('kpis').innerHTML=k.map(([a,b])=>`<div class="kpi"><b>${esc(b)}</b><span class="mute">${esc(a)}</span></div>`).join('');
  bars($('days'),Object.entries(d.by_day).map(([k,v])=>[k,v.requests])); bars($('status'),Object.entries(d.status)); bars($('guard'),Object.entries(d.guardrails));
  bars($('users'),Object.entries(d.by_user).map(([k,v])=>[k,v.tokens]),v=>v.toLocaleString()+' tok'); bars($('sources'),d.top_sources);
  $('recent').innerHTML='<tr><th>Time (UTC)</th><th>User</th><th>Status</th><th>Tokens</th><th>Cost</th><th>Latency</th><th>Grounded</th><th>Guardrail</th></tr>'+d.recent.map(r=>`<tr><td>${esc(r.ts.slice(5,16).replace('T',' '))}</td><td>${esc(r.user)}</td><td class="${r.status==='ok'?'':'w'}">${esc(r.status)}</td><td>${(r.prompt_tokens||0)+(r.completion_tokens||0)}</td><td>$${(r.cost_usd||0).toFixed(6)}</td><td>${Math.round(r.latency_ms||0)} ms</td><td>${r.grounded==null?'–':Math.round(r.grounded*100)+'%'}</td><td>${esc(r.guardrail||'')}</td></tr>`).join('')}
</script></body></html>
