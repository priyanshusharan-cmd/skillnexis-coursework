# Render blueprint (free web service). Set ADMIN_KEY (and optionally GEMINI_API_KEY) as secret env vars in the dashboard.
# Note: the free plan has no persistent disk, so the SQLite database resets on each deploy/restart; attach a disk on a
# paid plan or point DB_PATH at a mounted volume elsewhere (Fly.io and Railway have small free volumes).
services:
  - type: web
    name: pep-assistant
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ADMIN_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: RATE_LIMIT_PER_MIN
        value: "30"
