<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>editor</title>
<style>
@font-face{font-family:"JB";src:url(../assets/jetbrains-mono-latin-400-normal.woff2)format("woff2");font-weight:400}
@font-face{font-family:"JB";src:url(../assets/jetbrains-mono-latin-700-normal.woff2)format("woff2");font-weight:700}
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;overflow:hidden;background:#11111b;font-family:Inter,sans-serif}
#stage{width:1920px;height:1080px;transform-origin:0 0;position:relative;display:grid;grid-template-columns:72px 300px 1fr;grid-template-rows:56px 1fr 400px 34px}
.bar{grid-column:1/4;background:#181825;color:#a6adc8;display:flex;align-items:center;padding:0 24px;font:500 20px Inter;gap:18px;border-bottom:1px solid #313244}
.dots i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px}
.act{grid-row:2/4;background:#181825;border-right:1px solid #313244}
.act div{width:34px;height:34px;margin:22px auto;border-radius:8px;border:3px solid #585b70}
.act div:first-child{border-color:#cdd6f4}
.side{grid-row:2/4;background:#1e1e2e;color:#bac2de;padding:20px;font:500 20px Inter;border-right:1px solid #313244}
.side h4{font:700 15px Inter;letter-spacing:.1em;color:#7f849c;margin-bottom:16px}
.side .f{padding:8px 12px;border-radius:6px;margin:4px 0}.side .f.on{background:#313244;color:#fff}
.ed{background:#1e1e2e;position:relative;overflow:hidden}
.tabs{height:52px;background:#181825;display:flex}
.tab{padding:0 26px;display:flex;align-items:center;color:#cdd6f4;font:500 21px Inter;background:#1e1e2e;border-top:3px solid #fab387}
pre{font:400 28px/1.6 JB;color:#cdd6f4;padding:26px 0;position:relative}
.ln{display:flex}.ln .n{width:90px;text-align:right;padding-right:34px;color:#585b70}.ln.cur .n{color:#cdd6f4}
.ln.hl{background:rgba(250,179,135,.18);box-shadow:inset 6px 0 0 #fab387}
.k{color:#cba6f7}.s{color:#a6e3a1}.d{color:#fab387}.c{color:#7f849c;font-style:italic}.b{color:#89b4fa}
.caret{display:inline-block;width:3px;height:1.1em;background:#f5e0dc;vertical-align:-.15em;margin-left:1px}
.term{grid-column:3;background:#11111b;border-top:1px solid #313244;padding:0 34px;overflow:hidden;position:relative}
.term .th{height:46px;display:flex;align-items:center;gap:30px;font:600 18px Inter;color:#7f849c;letter-spacing:.08em}
.term .th b{color:#cdd6f4;border-bottom:2px solid #89b4fa;padding-bottom:6px}
.term pre{font-size:25px;line-height:1.45;padding:6px 0;white-space:pre-wrap}
.pr{color:#a6e3a1}.er{color:#f38ba8;font-weight:700}.mk{background:rgba(249,226,175,.28);border-radius:4px}
.status{grid-column:1/4;background:#fab387;color:#11111b;font:600 17px Inter;display:flex;align-items:center;padding:0 22px;gap:30px}
.callout{position:absolute;background:#f9e2af;color:#11111b;font:700 30px Inter;padding:16px 26px;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.45);max-width:620px;line-height:1.3;transition:none}
.callout:before{content:"";position:absolute;left:-22px;top:22px;border:12px solid transparent;border-right:14px solid #f9e2af}
.callout.up:before{left:30px;top:-24px;border:12px solid transparent;border-bottom:14px solid #f9e2af}
.callout.down:before{left:30px;top:auto;bottom:-24px;border:12px solid transparent;border-top:14px solid #f9e2af}
.ring{position:absolute;border:5px solid #f9e2af;border-radius:14px;box-shadow:0 0 0 4000px rgba(0,0,0,.35)}
code,pre,.mono,.code,.tb{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
</style></head><body>
<div id="stage">
  <div class="bar"><span class="dots"><i style="background:#f38ba8"></i><i style="background:#f9e2af"></i><i style="background:#a6e3a1"></i></span><span id="title">code-in-small-steps — Visual Studio Code</span></div>
  <div class="act"><div></div><div></div><div></div><div></div></div>
  <div class="side"><h4>EXPLORER</h4><div style="color:#7f849c;margin-bottom:8px">▾ CODE-IN-SMALL-STEPS</div><div id="files"></div></div>
  <div class="ed"><div class="tabs"><div class="tab" id="tab">file.py</div></div><pre id="code"></pre></div>
  <div class="term"><div class="th"><b>TERMINAL</b><span>PROBLEMS</span><span>OUTPUT</span></div><pre id="out"></pre></div>
  <div class="status"><span>⎇ main</span><span>Python 3.13</span><span id="pos">Ln 1, Col 1</span><span style="margin-left:auto">UTF-8 · LF · Python</span></div>
</div>
<div id="ov"></div>
<script>
const KW=new Set(['def','return','if','else','elif','for','while','in','import','from','True','False','None','and','or','not','print','int','str','float','type','input','len','range','sum']);
const BUILT=new Set(['print','int','str','float','type','input','len','range','sum']);
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function hi(line){ // tiny Python highlighter: comments, strings, numbers, keywords, builtins
  let out='',i=0;while(i<line.length){const ch=line[i];
    if(ch==='#'){out+=`<span class="c">${esc(line.slice(i))}</span>`;break}
    if(ch==='"'||ch==="'"){let j=line.indexOf(ch,i+1);if(j<0)j=line.length-1;out+=`<span class="s">${esc(line.slice(i,j+1))}</span>`;i=j+1;continue}
    const m=line.slice(i).match(/^[A-Za-z_]\w*/);if(m){const w=m[0];out+=BUILT.has(w)?`<span class="b">${w}</span>`:KW.has(w)?`<span class="k">${w}</span>`:w;i+=w.length;continue}
    const n=line.slice(i).match(/^\d+(\.\d+)?/);if(n){out+=`<span class="d">${n[0]}</span>`;i+=n[0].length;continue}
    out+=esc(ch);i++}
  return out}
function fmtOut(s){return s.split('\n').map(l=>{
  if(/^\$ /.test(l))return `<span class="pr">${esc(l)}</span>`;
  if(/^\w*(Error|Exception)\b/.test(l))return `<span class="er">${esc(l)}</span>`;return esc(l)}).join('\n')}
window.TL={file:'file.py',files:['file.py'],events:[]};
window.render=(t)=>{const T=window.TL;let scroll=0,code='',caret=-1,term='',hlLine=0,file=T.file,zoom=[1,0,0],callouts=[],rings=[],typing=false;
  for(const e of T.events){if(e.t>t)break;
    if(e.type==='file'){file=e.file;code=e.text||'';caret=-1}
    if(e.type==='set'){code=e.text;caret=-1}
    if(e.type==='type'){const n=Math.min(e.text.length,Math.floor((t-e.t)*(e.cps||16)));code=e.base+e.text.slice(0,n)+(e.after||'');caret=e.base.length+n;typing=n<e.text.length}
    if(e.type==='run'){const k=Math.min(e.cmd.length,Math.floor((t-e.t)*28));term+=(term?'\n':'')+'$ '+e.cmd.slice(0,k);if(t-e.t>e.cmd.length/28+.35)term+='\n'+e.out}
    if(e.type==='clear')term='';
    if(e.type==='scroll'&&t<e.until)scroll=e.lines;
    if(e.type==='hl')hlLine=(t<e.until)?e.line:0;
    if(e.type==='zoom'){const u=Math.min(1,(t-e.t)/(e.dur||.6)),q=u*u*(3-2*u);zoom=zoom.map((v,i)=>v+([e.s,e.x,e.y][i]-v)*q)}
    if(e.type==='callout'&&t<e.until)callouts.push(e);
    if(e.type==='ring'&&t<e.until)rings.push(e)}
  document.getElementById('tab').textContent=file;
  document.getElementById('files').innerHTML=T.files.map(f=>`<div class="f ${f===file?'on':''}">📄 ${f}</div>`).join('');
  if(caret<0)caret=code.length;const caretOn=typing||Math.floor(t*2)%2===0;const withC=code.slice(0,caret)+'\u0001'+code.slice(caret);
  const lines=withC.split('\n');const cl=lines.findIndex(l=>l.includes('\u0001'));
  document.getElementById('code').innerHTML=lines.map((l,i)=>`<div class="ln ${i===cl?'cur':''} ${hlLine===i+1?'hl':''}"><span class="n">${i+1}</span><span>${hi(l).replace('\u0001',caretOn?'<span class="caret"></span>':'')}</span></div>`).join('');
  document.getElementById('pos').textContent=`Ln ${cl+1}, Col ${lines[cl].indexOf('\u0001')+1}`;
  const out=document.getElementById('out');let shown=term;const tl=term.split('\n');if(tl.length>9){const end=tl.length-scroll;shown=tl.slice(Math.max(0,end-9),end).join('\n')}
  let html=fmtOut(shown);for(const e of T.events){if(e.type==='mark'&&e.t<=t&&t<e.until)html=html.split(esc(e.text)).join(`<span class="mk">${esc(e.text)}</span>`)}
  out.innerHTML=html;
  const st=document.getElementById('stage');st.style.transform=`scale(${zoom[0]}) translate(${-zoom[1]}px,${-zoom[2]}px)`;
  document.getElementById('ov').innerHTML=rings.map(r=>`<div class="ring" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px"></div>`).join('')+
    callouts.map(c=>{const a=Math.min(1,(t-c.t)/.25);return `<div class="callout ${c.up?'up':''} ${c.down?'down':''}" style="left:${c.x}px;top:${c.y}px;opacity:${a};transform:translateY(${(1-a)*16}px)">${c.text}</div>`}).join('');
  return true};
</script></body></html>
