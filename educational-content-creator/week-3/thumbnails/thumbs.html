<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Thumbnails</title><style>
@font-face{font-family:"JB";src:url(../assets/jetbrains-mono-latin-700-normal.woff2)format("woff2");font-weight:700}
:root{--navy:#14213D;--cream:#FFF8EE;--orange:#E8590C;--yellow:#FFD43B;--red:#E03131;--green:#2B8A3E}
*{box-sizing:border-box;margin:0}body{background:#999;font-family:Inter,sans-serif}
.t{width:1280px;height:720px;position:relative;overflow:hidden;margin-bottom:20px}
.v{width:1080px;height:1920px;position:relative;overflow:hidden;margin-bottom:20px}
.cut{position:absolute;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))}
.big{font:900 150px/0.95 "Inter Display";letter-spacing:-.03em}
.code{font-family:JB;font-weight:700}
.chip{display:inline-block;padding:10px 26px;border-radius:16px;font:800 44px Inter}
.ring{position:absolute;border-radius:50%}
code,pre,.mono,.code,.tb{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
</style></head><body>
<!-- YT 1: if/else -->
<section class="t" id="yt-if-else" style="background:var(--navy)">
  <div class="ring" style="width:900px;height:900px;right:-260px;top:-120px;background:#1d2f57"></div>
  <img class="cut" src="cut_surprised.png" style="height:640px;right:30px;bottom:-40px">
  <div style="position:absolute;left:64px;top:70px">
    <div class="big code" style="color:var(--yellow);font-size:170px">if</div>
    <div class="big code" style="color:#fff;font-size:120px;margin-top:6px">/ else</div>
    <div style="font:800 64px 'Inter Display';color:#fff;margin-top:34px">Make Python<br><span style="color:var(--orange)">DECIDE</span></div>
  </div>
  <div class="chip code" style="position:absolute;left:64px;bottom:50px;background:#fff;color:var(--navy);font-size:40px">score &gt;= 40 → Pass</div>
</section>
<!-- YT 2: variables -->
<section class="t" id="yt-variables" style="background:var(--cream)">
  <img class="cut" src="cut_surprised.png" style="height:640px;right:20px;bottom:-40px">
  <div style="position:absolute;left:60px;top:80px">
    <div class="big code" style="color:var(--navy);font-size:120px">"5"+"2"</div>
    <div class="big code" style="color:var(--orange);font-size:200px;margin-top:10px">= "52"</div>
    <div class="chip" style="background:var(--navy);color:#fff;margin-top:40px">Python variables in 5 min</div>
  </div>
  <div style="position:absolute;right:330px;top:60px;font:900 120px 'Inter Display';color:var(--red);transform:rotate(12deg)">?!</div>
</section>
<!-- YT 3: errors -->
<section class="t" id="yt-errors" style="background:#1E1E2E">
  <img class="cut" src="cut_neutral.png" style="height:600px;right:30px;bottom:-40px">
  <div style="position:absolute;left:60px;top:60px">
    <div class="big" style="color:#fff;font-size:118px">READ ANY</div>
    <div class="big" style="color:var(--yellow);font-size:150px">ERROR</div>
    <div class="code" style="margin-top:40px;background:#11111b;border:4px solid #f38ba8;border-radius:18px;padding:18px 26px;color:#f38ba8;font-size:36px">NameError: name 'totl'<br>is not defined</div>
  </div>
  <div class="chip" style="position:absolute;left:60px;bottom:40px;background:var(--orange);color:#fff">3 steps · Python</div>
</section>
<!-- Shorts covers -->
<section class="v" id="cover-equals" style="background:var(--navy)">
  <div style="position:absolute;left:0;right:0;top:330px;text-align:center">
    <div class="big code" style="color:#fff;font-size:260px">=</div><div style="font:800 80px Inter;color:#9fb3d9;margin:10px 0">vs</div><div class="big code" style="color:var(--yellow);font-size:260px">==</div>
    <div style="font:900 84px/1.1 'Inter Display';color:#fff;margin-top:50px">The #1 if<br>mistake</div></div>
  <img class="cut" src="cut_surprised.png" style="height:640px;left:50%;transform:translateX(-50%);bottom:-60px">
</section>
<section class="v" id="cover-elif" style="background:var(--cream)">
  <div style="position:absolute;left:0;right:0;top:330px;text-align:center">
    <div class="big" style="color:var(--navy);font-size:140px">95 marks…</div><div class="big code" style="color:var(--red);font-size:300px;margin:20px 0">"C"</div>
    <div style="font:900 84px/1.1 'Inter Display';color:var(--orange)">elif order<br>matters</div></div>
  <img class="cut" src="cut_surprised.png" style="height:600px;left:50%;transform:translateX(-50%);bottom:-60px">
</section>
<section class="v" id="cover-indent" style="background:#1E1E2E">
  <div style="position:absolute;left:0;right:0;top:330px;text-align:center">
    <div class="code" style="display:inline-block;text-align:left;background:#11111b;border-radius:28px;padding:40px 50px;font-size:60px;color:#cdd6f4;line-height:1.5">if score &gt;= 40:<br><span style="background:rgba(232,89,12,.45)">····</span>print("Pass")</div>
    <div style="font:900 104px/1.05 'Inter Display';color:#fff;margin-top:60px">4 spaces</div><div style="font:900 104px/1.05 'Inter Display';color:var(--yellow)">that matter</div></div>
  <img class="cut" src="cut_neutral.png" style="height:560px;left:50%;transform:translateX(-50%);bottom:-60px">
</section>
</body></html>
