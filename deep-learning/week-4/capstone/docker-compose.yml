services:
  api:
    build: .
    ports: ["8000:8000"]
    restart: unless-stopped
  ui:
    build: .
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
    healthcheck:
      disable: true
