name: Embedded firmware

# Builds the ATmega328P firmware with avr-gcc, runs the host unit tests,
# and runs the logger firmware in the simavr simulator with scripted sensor scenarios.
on:
  push:
    paths: ["iot-c-embedded/**", ".github/workflows/embedded.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: iot-c-embedded/week-2
    steps:
      - uses: actions/checkout@v4
      - name: Install AVR toolchain and simavr
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-avr avr-libc binutils-avr simavr libsimavr-dev libelf-dev
      - name: Build both firmwares (-Wall -Wextra -Werror)
        run: make all size
      - name: Host unit tests (ASan + UBSan)
        run: make test
      - name: Run the logger in simavr
        run: make sim

  week3:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: iot-c-embedded/week-3
    steps:
      - uses: actions/checkout@v4
      - name: Install AVR toolchain, simavr and Mosquitto
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-avr avr-libc binutils-avr simavr libsimavr-dev libelf-dev mosquitto mosquitto-clients python3-pil
      - name: Build (servo/OLED firmware, PC station, tests)
        run: make all
      - name: Unit tests (MQTT encoder, BME280 compensation vs datasheet)
        run: make test
      - name: MQTT end-to-end against a real Mosquitto broker
        run: make mqtt-test
      - name: Servo + OLED firmware in simavr
        run: make sim

  esp32:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: iot-c-embedded/week-3/esp32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:   # toolchains only: PlatformIO's Python env (penv) is not portable between cache restores
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-pkgs-espidf-6.9.0-v2
      - run: pip install platformio
      - name: Build ESP32 firmware (ESP-IDF via PlatformIO)
        run: pio run
      - name: Firmware size
        run: pio run -t size | tail -15

  week4:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: iot-c-embedded/week-4
    steps:
      - uses: actions/checkout@v4
      - name: Install plotting
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-matplotlib
      - name: Irrigation logic unit tests
        run: make test
      - name: 3-day simulation, real FreeRTOS kernel (POSIX port)
        timeout-minutes: 12
        run: make sim-freertos
      - name: 3-day simulation, pthread stand-in + chart
        run: make sim

  esp32-week4:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: iot-c-embedded/week-4/esp32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:   # toolchains only: PlatformIO's Python env (penv) is not portable between cache restores
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-pkgs-espidf-6.9.0-v2
      - run: pip install platformio
      - name: Build agri node firmware (FreeRTOS tasks, deep sleep, OTA + rollback)
        run: pio run
      - name: Firmware size
        run: pio run -t size | tail -15
