AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Account security baseline that stays free: a multi-region CloudTrail (the first copy of management events is free)
  into an encrypted, locked-down bucket with log file validation, plus EventBridge alerts for root logins,
  console logins without MFA, and IAM or security-group changes.

Parameters:
  AlertEmail: { Type: String }

Resources:
  TrailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      VersioningConfiguration: { Status: Enabled }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      LifecycleConfiguration:
        Rules:
          - { Id: archive, Status: Enabled, Transitions: [{ TransitionInDays: 90, StorageClass: GLACIER }], ExpirationInDays: 730 }

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Statement:
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
            Condition: { StringEquals: { "aws:SourceArn": !Sub "arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/account-trail" } }
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub "${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition: { StringEquals: { "aws:SourceArn": !Sub "arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/account-trail" } }
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt TrailBucket.Arn, !Sub "${TrailBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: account-trail
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true      # tampering with delivered logs is detectable

  Alerts:
    Type: AWS::SNS::Topic
    Properties:
      Subscription: [{ Protocol: email, Endpoint: !Ref AlertEmail }]
  AlertsPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref Alerts]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref Alerts

  RootLogin:
    Type: AWS::Events::Rule
    Properties:
      Description: Someone signed in as the root user
      EventPattern:
        detail-type: [AWS Console Sign In via CloudTrail]
        detail: { userIdentity: { type: [Root] } }
      Targets: [{ Id: email, Arn: !Ref Alerts }]

  LoginWithoutMfa:
    Type: AWS::Events::Rule
    Properties:
      Description: Successful console sign-in without MFA
      EventPattern:
        detail-type: [AWS Console Sign In via CloudTrail]
        detail:
          responseElements: { ConsoleLogin: [Success] }
          additionalEventData: { MFAUsed: ["No"] }
      Targets: [{ Id: email, Arn: !Ref Alerts }]

  RiskyChanges:
    Type: AWS::Events::Rule
    Properties:
      Description: IAM policy changes or a security group opened up
      EventPattern:
        detail-type: [AWS API Call via CloudTrail]
        source: [aws.iam, aws.ec2]
        detail:
          eventName: [AttachUserPolicy, PutUserPolicy, CreateAccessKey, AttachRolePolicy, PutRolePolicy,
                      AuthorizeSecurityGroupIngress, CreateLoginProfile, DeactivateMFADevice]
      Targets: [{ Id: email, Arn: !Ref Alerts }]

Outputs:
  AlertTopicArn: { Value: !Ref Alerts }
  TrailBucket: { Value: !Ref TrailBucket }
