AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One CloudWatch dashboard and the alarms that matter for the week 2 API and the week 3 web tier,
  rolled up into a single composite "service unhealthy" alarm so one page means one real problem.
  (3 dashboards and 10 alarms are always free.)

Parameters:
  ApiFunctionName: { Type: String, Description: week2-api ItemsFunction name }
  ApiId: { Type: String, Description: week2-api HTTP API id }
  TableName: { Type: String }
  AlertTopicArn: { Type: String }

Resources:
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: study-links
      DashboardBody: !Sub |
        {"widgets": [
          {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6, "properties": {"title": "API requests and errors", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
            "metrics": [["AWS/ApiGateway", "Count", "ApiId", "${ApiId}"], [".", "4xx", ".", "."], [".", "5xx", ".", "."]]}},
          {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6, "properties": {"title": "Lambda duration p50 / p99 (ms)", "region": "${AWS::Region}", "period": 300,
            "metrics": [["AWS/Lambda", "Duration", "FunctionName", "${ApiFunctionName}", {"stat": "p50"}], ["...", {"stat": "p99"}]]}},
          {"type": "metric", "x": 0, "y": 6, "width": 12, "height": 6, "properties": {"title": "Lambda errors and throttles", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
            "metrics": [["AWS/Lambda", "Errors", "FunctionName", "${ApiFunctionName}"], [".", "Throttles", ".", "."]]}},
          {"type": "metric", "x": 12, "y": 6, "width": 12, "height": 6, "properties": {"title": "DynamoDB consumed capacity and throttles", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
            "metrics": [["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${TableName}"], [".", "ConsumedWriteCapacityUnits", ".", "."], [".", "ThrottledRequests", ".", "."]]}},
          {"type": "log", "x": 0, "y": 12, "width": 24, "height": 6, "properties": {"title": "Latest Lambda errors", "region": "${AWS::Region}",
            "query": "SOURCE '/aws/lambda/${ApiFunctionName}' | fields @timestamp, @message | filter @message like /ERROR|Task timed out/ | sort @timestamp desc | limit 20"}}
        ]}

  Api5xx:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: More than 5 % of API requests failing with 5xx for 10 minutes
      Metrics:
        - Id: errors
          ReturnData: false
          MetricStat: { Metric: { Namespace: AWS/ApiGateway, MetricName: 5xx, Dimensions: [{ Name: ApiId, Value: !Ref ApiId }] }, Period: 300, Stat: Sum }
        - Id: requests
          ReturnData: false
          MetricStat: { Metric: { Namespace: AWS/ApiGateway, MetricName: Count, Dimensions: [{ Name: ApiId, Value: !Ref ApiId }] }, Period: 300, Stat: Sum }
        - Id: rate
          Expression: "IF(requests > 20, 100 * errors / requests, 0)"
          Label: 5xx rate (%)
          ReturnData: true
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  SlowApi:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: p99 Lambda duration above 2 s for 15 minutes
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunctionName }]
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 3
      Threshold: 2000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  DbThrottles:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: DynamoDB is throttling requests
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions: [{ Name: TableName, Value: !Ref TableName }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ServiceUnhealthy:
    Type: AWS::CloudWatch::CompositeAlarm
    Properties:
      AlarmDescription: Study-links is failing or too slow for users (pages once, not three times)
      AlarmRule: !Sub "ALARM(\"${Api5xx}\") OR ALARM(\"${SlowApi}\") OR ALARM(\"${DbThrottles}\")"
      AlarmActions: [!Ref AlertTopicArn]
      OKActions: [!Ref AlertTopicArn]

Outputs:
  DashboardUrl: { Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home#dashboards:name=study-links" }
