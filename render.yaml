# One-click deploy on Render's free plan: Dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: skillnexis-blog-api
    runtime: python
    plan: free
    rootDir: software-engineer/week-3
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn blog_api.app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'   # real client IP for rate limits
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true        # Render creates a long random secret
      - key: BLOG_DB
        value: /tmp/blog.db        # free plan has no persistent disk: data resets on redeploy
      - key: PYTHON_VERSION
        value: "3.12.7"

  # Software Engineer week 4: Blogly, deployed from its Dockerfile.
  - type: web
    name: blogly
    runtime: docker
    plan: free
    rootDir: software-engineer/week-4
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false            # GitHub Actions deploys through the deploy hook after tests pass
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: BLOG_DB
        value: /tmp/blog.db      # free plan: no persistent disk
