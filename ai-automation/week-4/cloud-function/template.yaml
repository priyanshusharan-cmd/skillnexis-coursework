# AWS SAM template: deploy with `sam build && sam deploy --guided` (AWS free tier: 1M Lambda requests/month).
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Repo-health checker as a cloud function (HTTP + weekly schedule)
Parameters:
  Repos: {Type: String, Default: "psf/requests,encode/httpx,aio-libs/aiohttp,scrapy/scrapy"}
Resources:
  RepoHealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 30
      Environment: {Variables: {REPOS: !Ref Repos}}
      FunctionUrlConfig: {AuthType: NONE}
      Events:
        Weekly:
          Type: Schedule
          Properties: {Schedule: "cron(0 4 ? * MON *)", Input: !Sub '{"repos": ["${Repos}"]}'}
Outputs:
  FunctionUrl: {Value: !GetAtt RepoHealthFunctionUrl.FunctionUrl}
