# Render Blueprint (free web service): New → Blueprint → pick this repo. Add the secrets in the dashboard.
services:
  - type: web
    name: ai-business-assistant
    runtime: docker
    plan: free
    rootDir: ai-automation/week-4/assistant
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/status
    envVars:
      - {key: POLL_MINUTES, value: "10"}
      - {key: OWNER_NAME, value: "Priya"}
      - {key: IMAP_HOST, sync: false}
      - {key: IMAP_USER, sync: false}
      - {key: IMAP_PASS, sync: false}
      - {key: SMTP_HOST, sync: false}
      - {key: SMTP_USER, sync: false}
      - {key: SMTP_PASS, sync: false}
      - {key: GEMINI_API_KEY, sync: false}
