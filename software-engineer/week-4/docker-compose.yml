# Local production-like stack: API + Prometheus + Grafana.
#   export JWT_SECRET=$(python -c "import secrets; print(secrets.token_urlsafe(48))")
#   docker compose up --build
# App http://localhost:8000 · Prometheus http://localhost:9090 · Grafana http://localhost:3000 (admin / admin)
services:
  api:
    build: .
    image: blogly:local
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET first}
      METRICS_TOKEN: ${METRICS_TOKEN:-local-metrics-token}
    ports: ["8000:8000"]
    volumes: ["blog-data:/data"]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [api]
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
volumes:
  blog-data:
